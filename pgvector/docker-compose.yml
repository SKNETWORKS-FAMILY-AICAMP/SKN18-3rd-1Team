version: '3.8'  # Docker Compose 파일 버전

services:
  ############################################################
  # PostgreSQL + pgvector
  ############################################################
  postgres:
    image: pgvector/pgvector:pg16        # PostgreSQL 16 + pgvector 포함
    container_name: skn18-3rd-1team
    restart: always

    environment:
      POSTGRES_USER: admin               # PostgreSQL 접속 사용자 이름
      POSTGRES_PASSWORD: admin123       # PostgreSQL 접속 비밀번호
      POSTGRES_DB: UNITvectordb                   # 기본 생성 DB 이름

    ports:
      - "5432:5432"                      # 호스트 포트:컨테이너 포트

    volumes:
      # 데이터 영속화
      - ./database:/var/lib/postgresql/data
      # 초기 스크립트 자동 실행
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

############################################################
# 디렉토리 구조
# ├── docker-compose.yml
# ├── database/
# └── init.sql
############################################################
