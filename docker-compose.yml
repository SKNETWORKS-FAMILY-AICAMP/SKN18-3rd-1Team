# docker-compose.yml
version: "3.8"

services:
  db:
    image: ankane/pgvector
    container_name: vectordb
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: vectordb
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
